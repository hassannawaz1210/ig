<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Reels</title>
<link rel="stylesheet" href="/static/reels.css"></head>
<body>
<div class="top">
  <details class="feed-menu" id="feed-menu">
    <summary aria-label="Choose feeds" aria-keyshortcuts="," title="Choose feeds (,)"><span id="feed-selection-label">All feeds</span><svg class="feed-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></summary>
    <div class="feed-panel">
      <div class="feed-panel-heading">Feeds <kbd>esc</kbd></div>
      <div class="feed-choices" id="feed-choices" role="group" aria-label="Choose feeds" aria-busy="false">
        <button type="button" class="feed-choice" data-all="true" aria-pressed="false">{{icon:check}}<span>All feeds</span></button>
        {{feed_choices}}
      </div>
      <div class="feed-key-hints"><span><kbd>↑ ↓</kbd> move</span><span><kbd>Space</kbd> mix</span><span><kbd>Enter</kbd> only</span></div>
      <div class="feed-tools">
        <button type="button" onclick="document.getElementById('feed-menu').open=false; chooseFeed('', true)">Create feed <kbd>+</kbd></button>
        <button type="button" onclick="document.getElementById('feed-menu').open=false; chooseFeed()">Add accounts <kbd>Shift A</kbd></button>
      </div>
      <div class="feed-panel-footer"><a id="saved-reels-link" href="/saved-reels" target="_blank" rel="noopener">{{icon:bookmark}}<span>Saved reels</span></a><span class="count" id="count"></span></div>
    </div>
  </details>
  <span class="feed-busy" id="feed-busy" hidden><span class="spinner" aria-hidden="true"></span><span class="visually-hidden">Switching feeds…</span></span>
  <span id="preference-status" role="status" aria-live="polite"></span>
  <button id="shortcuts" type="button" onclick="showShortcuts()" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">{{icon:keyboard}}</button>
  <button id="creator-browse" type="button" hidden onclick="leaveCreatorBrowse()" title="Return to mixed feed"></button>
  <span id="action-status" role="status" aria-live="polite"></span>
  <button id="auto-scroll" type="button" onclick="toggleAutoScroll()" title="Auto-scroll (T)" aria-label="Auto-scroll (T)" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 5 6 6 6-6M6 13l6 6 6-6"/></svg></button>
  <button id="mute" onclick="toggleMute()" title="Unmute (M)" aria-label="Unmute (M)" aria-pressed="true">{{icon:muted}}</button></div>
<div id="feed"></div>
<button id="comments-backdrop" onpointerup="closeComments()" type="button" aria-label="Close comments" onclick="closeComments()" tabindex="-1"></button>
<aside id="comments-panel" aria-label="Reel comments" hidden>
  <div class="comments-heading"><span class="sheet-handle" aria-hidden="true"></span><b>Comments</b><button type="button" onclick="closeComments()" aria-label="Close comments">✕</button></div>
  <div id="comments-body" aria-live="polite"></div>
</aside>
<div id="feed-status" class="feed-status" data-mode="overlay" data-state="loading" role="status" aria-live="polite">
  <span class="spinner" aria-hidden="true"></span>
  <span id="feed-status-text">Loading reels…</span>
  <button id="feed-retry" type="button" onclick="retryLoading()" hidden>Try again</button>
  <button id="feed-create" type="button" onclick="chooseFeed('', true)" hidden>Create feed (+)</button>
  <button id="feed-add" type="button" onclick="chooseFeed()" hidden>Add accounts (A)</button>
</div>
<script id="boot" type="application/json">{{boot}}</script>
<script src="/static/icons.js"></script>
<script src="/static/common.js"></script>
<script src="/static/reels.js"></script>
</body></html>
