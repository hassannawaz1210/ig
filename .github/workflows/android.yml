name: Android APK

on:
  push:
    branches: [android-standalone]
    paths:
      - 'android/**'
      - 'src/ig/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install native wheel build prerequisites
        run: sudo apt-get update && sudo apt-get install -y patchelf patch unzip wget
      - name: Build native Android CFFI
        shell: bash
        run: |
          mkdir -p android/build/smoke
          set -o pipefail
          bash android/ci/build-cffi.sh 2>&1 | tee android/build/smoke/cffi-build.txt
      - name: Keep native Android wheels
        uses: actions/upload-artifact@v4
        with:
          name: ig-android-native-wheels
          path: android/wheels/*.whl
          if-no-files-found: error
          retention-days: 14
      - name: Restore preview signing key
        env:
          ANDROID_PREVIEW_KEYSTORE: ${{ secrets.ANDROID_PREVIEW_KEYSTORE }}
        shell: bash
        run: |
          test -n "$ANDROID_PREVIEW_KEYSTORE" || { echo 'Missing Android preview signing key'; exit 1; }
          preview_key="$RUNNER_TEMP/ig-preview.keystore"
          printf '%s' "$ANDROID_PREVIEW_KEYSTORE" | base64 --decode > "$preview_key"
          chmod 600 "$preview_key"
          actual_certificate=$(keytool -exportcert -alias androiddebugkey -keystore "$preview_key" -storepass android | sha256sum | cut -d ' ' -f 1)
          test "$actual_certificate" = e0ae751b94e608392125cba3322259081dc994c5c38f7b31679960617b9666f5 || { echo "Saved signing key certificate mismatch: $actual_certificate"; exit 1; }
          echo "IG_ANDROID_KEYSTORE=$preview_key" >> "$GITHUB_ENV"
      - name: Build standalone APK and instrumentation tests
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          export IG_ANDROID_VERSION_CODE=$((1000 + BUILD_NUMBER * 100 + BUILD_ATTEMPT))
          export IG_ANDROID_VERSION_NAME="0.5.0-preview.$BUILD_NUMBER.$BUILD_ATTEMPT"
          echo "IG_ANDROID_VERSION_CODE=$IG_ANDROID_VERSION_CODE" >> "$GITHUB_ENV"
          echo "IG_ANDROID_VERSION_NAME=$IG_ANDROID_VERSION_NAME" >> "$GITHUB_ENV"
          gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Verify stable APK signing identity
        run: python android/ci/verify_signing.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Keep installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ig-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare update metadata
        env:
          GH_REPO: ${{ github.repository }}
          UPDATE_TAG: android-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: python android/ci/publish_update.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: ig-android-update
          path: android/build/update/
          if-no-files-found: error
      - name: Keep on-device test APK
        uses: actions/upload-artifact@v4
        with:
          name: ig-android-instrumentation
          path: android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run ARM64 APK on Android with native translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: bash android/ci/emulator-smoke.sh
      - name: Keep emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/build/smoke/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: build-and-test
    if: github.repository == 'hassannawaz1210/ig' && github.ref == 'refs/heads/android-standalone'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ig-android-update
          path: android/build/update/
      - name: Publish after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_TAG: android-build-${{ github.run_id }}-${{ github.run_attempt }}
          UPDATE_COMMIT: ${{ github.sha }}
        run: python android/ci/publish_update.py publish
